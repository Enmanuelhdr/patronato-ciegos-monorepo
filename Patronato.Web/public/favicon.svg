<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="pncGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="pncShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Fondo institucional azul del Patronato -->
  <rect width="64" height="64" rx="14" fill="url(#pncGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.5"/>
  
  <!-- Pictograma Oficial de Persona con Bastón Blanco -->
  <g filter="url(#pncShadow)">
    <!-- Cabeza -->
    <circle cx="28" cy="17" r="5" fill="#FFFFFF"/>
    <!-- Cuerpo / Torso erguido -->
    <path d="M24 24 H32 L31 39 H25 Z" fill="#FFFFFF"/>
    <!-- Brazo con bastón -->
    <path d="M30 26 L36 34" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <!-- Bastón Blanco con punta reflectiva -->
    <line x1="36" y1="34" x2="48" y2="52" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="45" y1="48" x2="48" y2="52" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
    <!-- Piernas en paso firme -->
    <line x1="27" y1="38" x2="23" y2="51" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="29" y1="38" x2="34" y2="51" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>